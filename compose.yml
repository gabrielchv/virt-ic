name: virt-ic

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    networks: [lab]

networks:
  lab:
    name: virt-ic-lab
